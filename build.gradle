allprojects {
    group = project.property('project-group')
    version = "${project.property('project-version')}"

    // Gradle identifies a project by `group:name`, never by its path. Each
    // platform family holds a module named `core`, so on one shared group both
    // would be `io.github.mcagents:core` — the same module — and Gradle would
    // resolve one away in favour of the other. Nothing would fail: the engine
    // would simply shade eleven modules and ship without the twelfth.
    //
    // Qualifying a family's modules with the family folder's name keeps every
    // module distinct while the folders stay named as they read. Only the
    // platform modules are affected, and none of them is published, so no
    // coordinate anyone depends on changes.
    if (project.parent != null && project.parent.path.startsWith(':platforms:')) {
        group = "${group}.${project.parent.name}"
    }

    repositories {
        mavenCentral()
    }
}

subprojects {
    // Skip projects that don't have their own build.gradle file (e.g., the 'platforms' intermediate folder)
    if (!file('build.gradle').exists()) {
        return
    }

    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Only the two pure Java layers are published. The platform modules are
    // distributed as plugin and mod artifacts, so they carry no publication.
    if (project.name != 'api' && project.name != 'common') {
        return
    }

    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/${project.property('git-org-name')}/${project.property('git-repository')}"
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }

        publications.withType(MavenPublication) {
            // Qualify the coordinates with the root project name. Without this
            // the artifactId defaults to the bare module name, so every project
            // in this group would publish a colliding io.github.mcagents:api —
            // a consumer could not depend on core and another project at the
            // same time. Matches the archivesName each module sets for its jar.
            artifactId = "${rootProject.name}-${project.name}"

            pom {
                url = "https://mcagents.github.io/website"
                developers {
                    developer {
                        id = "jetsadawijit"
                        name = "jetsadawijit"
                        url = "https://jetsadawijit.github.io"
                    }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
