plugins {
    id 'java-library'
}

repositories {
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // The shared layers are bundled once, by the engine. Every module below
    // the engine declares them compileOnly so no jar carries a second copy.
    compileOnly project(':api')
    compileOnly project(':common')

    // The Bukkit family core. This module adds only what PaperMC itself
    // needs on top of it.
    compileOnly project(':platforms:bukkit')

    // Paper is a superset of the Spigot API, so this coordinate provides the
    // Bukkit and Spigot types as well. Anything compiled against a Paper only
    // type does not run on SpigotMC.
    compileOnly libs.paper.api
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

base {
    archivesName = "${rootProject.name}-papermc"
}
