name: MCAgents
version: '${version}'
main: io.github.mcagents.core.foliamc.FoliaMCCorePlugin
api-version: '1.21'
description: The MCAgents agent API. Provides language model access to other plugins.
authors: [jetsadawijit]
website: https://mcagents.github.io/website

# The provider performs no scheduling and touches no game state: every call is
# a CompletableFuture over an HTTP client. There is nothing here for regionised
# multithreading to break, which is what makes this claim honest.
folia-supported: true
# No commands and no permissions, deliberately. This plugin is a service that
# consumer plugins bind to; it exposes nothing to players.
