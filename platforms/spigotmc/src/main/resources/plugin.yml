name: MCAgents
version: '${version}'
main: io.github.mcagents.core.spigotmc.SpigotMCCorePlugin
api-version: '1.21'
description: The MCAgents agent API. Provides language model access to other plugins.
authors: [jetsadawijit]
website: https://mcagents.github.io/website

# The only command is administrative. This plugin is a service that consumer
# plugins bind to; it exposes nothing to players.
commands:
  mcagents:
    description: Show which platforms have a usable API token, or reload config.yml.
    usage: /mcagents status | /mcagents reload

permissions:
  mcagents.admin:
    description: Allows running /mcagents, which reports credential health and reloads config.yml.
    default: op
