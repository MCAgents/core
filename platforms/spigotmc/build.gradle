plugins {
    id 'java-library'
}

repositories {
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

dependencies {
    // The shared layers are bundled once, by the engine. Every module below
    // the engine declares them compileOnly so no jar carries a second copy.
    compileOnly project(':api')
    compileOnly project(':common')

    // The Bukkit family core. This module adds only what SpigotMC itself
    // needs on top of it.
    compileOnly project(':platforms:bukkit')

    compileOnly libs.spigot.api
}

base {
    archivesName = "${rootProject.name}-spigotmc"
}
