# =====================================================================
#  MCAgents — API credentials
# =====================================================================
#  This file is the ONE place API tokens are configured on this server.
#
#  Every MCAgents plugin — MCAgentsChat and anything added later —
#  reads its credentials from here. They have no token settings of
#  their own, so a key is pasted once and rotated once.
#
#  After editing, run:  /mcagents reload
#  There is no need to restart the server.
#
#  KEEP THIS FILE PRIVATE. Anyone who can read it can spend your
#  credit at the AI provider.
# =====================================================================


# ---------------------------------------------------------------------
#  API tokens, per platform.
#
#  Each platform takes a LIST. Supplying more than one is useful:
#
#    * When a service rate limits one key, MCAgents moves to the next
#      and KEEPS the busy one.
#    * When a service REJECTS a key — expired, revoked, out of credit —
#      MCAgents moves to the next AND DELETES the dead key from this
#      file, so it is not retried forever.
#
#  Only a rejection deletes a key. A rate limit, a timeout, or a
#  service outage never does.
#
#  Configure only the platform(s) you use. Leave the rest empty.
#  Which platform a given plugin talks to is that plugin's setting.
#
#    openrouter  - one key, many providers.  openrouter.ai
#    openai      - platform.openai.com
#    deepseek    - platform.deepseek.com
#    anthropic   - console.anthropic.com
# ---------------------------------------------------------------------

openrouter:
  token: []

openai:
  token: []

deepseek:
  token: []

anthropic:
  token: []
