plugins {
    id 'java-library'
}

dependencies {
    // The shared layers are bundled once, by the engine. Every module below
    // the engine declares them compileOnly so no jar carries a second copy.
    compileOnly project(':api')
    compileOnly project(':common')

    // The mod family core, which holds the side machinery this module is one
    // half of. Nothing here may depend on the client half — a dedicated
    // server must never load a client class, and the surest way to guarantee
    // that is for the dependency not to exist.
    compileOnly project(':platforms:mods:core')

    // JSON codec for the credential file under the server run directory.
    // compileOnly because Minecraft itself puts Gson on the classpath.
    compileOnly libs.gson
}

// No mod loader coordinate is declared here, for the same reason as the rest
// of the mod family: the loader toolchains (ModDevGradle for NeoForge, Loom
// for Fabric) arrive with the modules that need them. What this module holds
// is the dedicated server half in plain Java, so it stays testable without a
// game.

base {
    archivesName = "${rootProject.name}-mods-server"
}
