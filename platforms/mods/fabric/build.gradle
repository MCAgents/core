plugins {
    id 'java-library'
}

dependencies {
    // The shared layers are bundled once, by the engine. Every module below
    // the engine declares them compileOnly so no jar carries a second copy.
    compileOnly project(':api')
    compileOnly project(':common')

    // The mod family core, mirroring the role platforms:bukkit:core plays for the
    // server side. This module adds only what Fabric itself needs.
    compileOnly project(':platforms:mods:core')

    compileOnly libs.gson
}

// The Fabric coordinates are not declared yet. Resolving the loader and the
// Fabric API requires the Loom toolchain, which remaps Minecraft as part of
// the build. It is introduced together with the first real Fabric entry point
// rather than being scaffolded ahead of the code that needs it.

base {
    archivesName = "${rootProject.name}-fabric"
}
