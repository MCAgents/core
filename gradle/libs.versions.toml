# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
#
# Every platform API coordinate the build compiles against lives here, so a
# version bump is a one line change in a single file rather than a sweep across
# the platform modules.

[versions]
# JSON codec used to read and write the vendor wire formats. Provided by every
# target platform at runtime, so it is only ever a compileOnly dependency.
gson = "2.14.0"
# Latest published SpigotMC snapshot. Bukkit and Spigot types come from here.
spigot-api = "26.2-R0.1-SNAPSHOT"
# Latest published PaperMC build. A superset of the Spigot API.
paper-api = "26.2.build.111-stable"
# Latest published Folia build. A superset of the Paper API, with the
# regionised schedulers replacing the single main thread.
folia-api = "26.2.build.1-beta"
# The test framework, applied to every module from the root build. Declared
# once as a BOM so the jupiter and platform artifacts can never drift apart.
junit = "6.1.3"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }

# Versionless on purpose: the BOM above pins both, so there is exactly one
# number to change when the test framework moves.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
