plugins {
    id 'java-library'
}

base {
    archivesName = "${rootProject.name}-api"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "${rootProject.name}-${project.name}"
                description = "MCAgents Core API"
            }
        }
    }
}
